services:
  insightops:
    build: .
    image: insightops-ai:0.5.0
    container_name: insightops-ai
    ports:
      - "8010:8010"
    environment:
      # Works out-of-the-box offline via the mock provider.
      INSIGHTOPS_LLM_ENABLED: "true"
      INSIGHTOPS_LLM_MOCK_ENABLED: "true"
      INSIGHTOPS_JSON_LOGS: "true"
      # Provide real keys to upgrade from mock to live providers:
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      HF_API_KEY: "${HF_API_KEY:-}"
      JETSTREAM_API_KEY: "${JETSTREAM_API_KEY:-}"
    restart: unless-stopped
